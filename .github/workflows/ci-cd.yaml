name: CI-CD Pipeline

on:
  push:
    branches: ["production"]
  pull_request:
    branches: ["production"]

jobs:
  # JOB 1: Verifikasi (Jalan di PR & Push)
  build-test:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Docker Build
        run: docker build .

  # JOB 2: Deployment (HANYA jalan saat Merge/Push ke production)
  deploy-production:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [build-test]
    # Filter agar tidak dobel: Hanya eksekusi jika kejadiannya adalah PUSH (Merge)
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: lombokhalalroom/lombok-halal-room-web-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml"
          target: "/opt/lhr"

      - name: SSH Deploy & Track Time
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            start=$(date +%s)
            cd /opt/lhr

            echo "--- Generating Integrity Manifest (MD5) ---"
            find . -maxdepth 1 -type f -not -name "manifest_deploy.txt" -exec md5sum {} + > manifest_deploy.txt

            echo "--- Updating Container ---"
            docker compose pull
            docker compose up -d --remove-orphans

            echo "--- Health Checking (Port 3001) ---"
            until curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 | grep -q 200; do
              printf "."
              sleep 1
            done

            end=$(date +%s)
            echo -e "\n===================================================="
            echo "DEPLOYMENT SUCCESS!"
            echo "Frontend Deployment Time: $((end - start)) seconds"
            echo "===================================================="
            docker image prune -f
