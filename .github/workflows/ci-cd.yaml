name: CI-CD Pipeline
on:
  push:
    branches: ["production"]
  pull_request:
    branches: ["production"]

jobs:
  # JOB 1: Build & Push (Jalan di PR untuk verifikasi, dan di Push untuk finalisasi)
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Membuat tag unik menggunakan Short SHA (7 karakter pertama commit)
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push dilakukan di tahap ini. Jika ini PR, ini berfungsi sebagai verifikasi.
      # Jika ini Push (Merge), ini memastikan image siap ditarik VPS.
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lombokhalalroom/lombok-halal-room-web-app:latest
            lombokhalalroom/lombok-halal-room-web-app:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 2: Deployment (HANYA jalan saat Merge/Push ke production)
  deploy-production:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml"
          target: "/opt/lhr"

      - name: SSH Deploy & Atomic Update
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            start=$(date +%s)
            cd /opt/lhr

            # MENGGANTI TAG IMAGE SECARA DINAMIS. Mencari baris image dan menggantinya dengan tag SHA yang baru saja di-build
            sed -i "s|image: lombokhalalroom/lombok-halal-room-web-app:.*|image: lombokhalalroom/lombok-halal-room-web-app:${{ steps.vars.outputs.sha_short }}|g" docker-compose.yml

            echo "--- Updating Container to Version: ${{ steps.vars.outputs.sha_short }} ---"
            docker compose pull
            docker compose up -d --remove-orphans

            echo "--- Health Checking (Port 3001) ---"
            until curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 | grep -q 200; do
              printf "."
              sleep 1
            done

            end=$(date +%s)
            echo -e "\n===================================================="
            echo "DEPLOYMENT SUCCESS!"
            echo "Deployment Time: $((end - start)) seconds"
            echo "===================================================="
            docker image prune -f
